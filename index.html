<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極上溫泉物語：豪華渡假村 - Onsen Resort Tycoon</title>
    <!-- 引入動畫庫與圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d35400;
            --secondary: #e67e22;
            --accent: #27ae60;
            --bg: #fdf2e9;
            --panel: #ffffff;
            --text: #2c3e50;
            --wood: #8b4513;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg);
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* 介面佈局 */
        #game-layout {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 左側：渡假村視覺區 */
        #resort-view {
            flex-grow: 1;
            position: relative;
            background: linear-gradient(to bottom, #aed6f1 0%, #d6eaf8 100%);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #skyline {
            position: absolute;
            top: 20px;
            font-size: 100px;
            opacity: 0.3;
            user-select: none;
        }

        #pool-area {
            margin-top: auto;
            margin-bottom: 50px;
            position: relative;
            z-index: 10;
        }

        .main-onsen {
            font-size: clamp(100px, 20vw, 180px);
            cursor: pointer;
            transition: all 0.1s;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
            user-select: none;
            animation: float-slow 3s ease-in-out infinite;
        }

        .main-onsen:active { 
            animation: shake 0.2s infinite;
            transform: scale(0.95);
        }

        @keyframes float-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
        }

        /* 裝飾物容器 */
        #decorations {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .decor {
            position: absolute;
            font-size: 40px;
            animation: bounce-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), bob 2s ease-in-out infinite;
        }

        @keyframes bounce-in {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes bob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        /* 蒸氣動畫 */
        .steam-particle {
            position: absolute;
            color: white;
            opacity: 0.6;
            font-size: 24px;
            pointer-events: none;
            animation: steam-rise 3s linear forwards;
        }

        @keyframes steam-rise {
            0% { transform: translateY(0) scale(1); opacity: 0.6; }
            100% { transform: translateY(-200px) scale(2); opacity: 0; }
        }

        /* 頂部數據列 */
        #top-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 100;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255,255,255,0.9);
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            border: 2px solid var(--wood);
            min-height: 50px;
        }

        .stat-val {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary);
            margin-left: 8px;
        }

        /* 右側：商店與升級面板 */
        #side-panel {
            width: 400px;
            background: var(--panel);
            border-left: 4px solid var(--wood);
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 20px rgba(0,0,0,0.1);
        }

        .tabs {
            display: flex;
            background: var(--wood);
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .tab.active { background: var(--primary); }

        .panel-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* 商店物件 */
        .shop-item {
            background: #fff;
            border: 2px solid #eee;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .shop-item:hover:not(.locked) {
            border-color: var(--secondary);
            background: #fff9f5;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .shop-item.locked {
            opacity: 0.6;
            filter: grayscale(1);
            cursor: not-allowed;
        }

        .item-icon {
            font-size: 40px;
            margin-right: 15px;
            width: 60px;
            text-align: center;
        }

        .item-details { flex-grow: 1; }
        .item-name { font-weight: bold; font-size: 1.1rem; display: block; }
        .item-desc { font-size: 0.85rem; color: #7f8c8d; }

        .item-stats {
            margin-top: 5px;
            font-size: 0.9rem;
            color: var(--accent);
            font-weight: bold;
        }

        .item-cost-tag {
            background: var(--bg);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            color: var(--primary);
        }

        .item-count {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--wood);
            color: white;
            padding: 2px 10px;
            border-bottom-left-radius: 10px;
            font-size: 0.8rem;
        }

        /* 特效 */
        .click-pop {
            position: absolute;
            pointer-events: none;
            font-weight: bold;
            color: var(--primary);
            font-size: 24px;
            z-index: 1000;
            text-shadow: 1px 1px 2px white;
        }

        /* 進度條 */
        #level-progress-container {
            width: 100px;
            height: 10px;
            background: #ddd;
            border-radius: 5px;
            margin-top: 5px;
            overflow: hidden;
        }

        #level-progress-bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s;
        }

        /* 選單與控制 */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: white;
            border: 2px solid var(--wood);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* 響應式 */
        @media (max-width: 900px) {
            #game-layout { flex-direction: column; }
            #side-panel { width: 100%; height: 50%; border-left: none; border-top: 4px solid var(--wood); }
            #top-bar { top: 10px; left: 10px; }
            .stat-card { padding: 5px 15px; min-height: 40px; }
            .stat-val { font-size: 1rem; }
            .main-onsen { font-size: 120px; }
        }
    </style>
</head>
<body>

    <div id="game-layout">
        <div id="resort-view">
            <div id="skyline">🗻</div>
            
            <div id="top-bar">
                <div class="stat-card">
                    💰 <span class="stat-val" id="money">0</span>
                </div>
                <div class="stat-card" style="flex-direction: column; align-items: flex-start;">
                    <div style="display: flex; align-items: center;">
                        ⭐ 等級 <span class="stat-val" id="level" style="font-size: 1.2rem;">1</span>
                    </div>
                    <div id="level-progress-container">
                        <div id="level-progress-bar"></div>
                    </div>
                </div>
                <div class="stat-card">
                    🕒 <span class="stat-val" id="mps" style="color: var(--accent);">0</span> <small>/s</small>
                </div>
            </div>

            <div id="decorations"></div>

            <div id="pool-area">
                <div class="main-onsen" id="clicker">♨️</div>
            </div>

            <div id="controls">
                <div class="icon-btn" id="mute-btn">🔊</div>
                <div class="icon-btn" id="reset-btn">🔄</div>
            </div>
        </div>

        <div id="side-panel">
            <div class="tabs">
                <div class="tab active" data-tab="shop">建設商店</div>
                <div class="tab" data-tab="upgrades">技術研發</div>
            </div>
            
            <div class="panel-content" id="shop-content">
                <!-- 商店內容由 JS 動態生成 -->
            </div>
        </div>
    </div>

    <script>
        // 音效系統
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let muted = false;

        function playSound(freq, type, duration) {
            if (muted) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const sounds = {
            click: () => playSound(440, 'sine', 0.1),
            buy: () => playSound(880, 'square', 0.2),
            levelUp: () => {
                playSound(523.25, 'sine', 0.1);
                setTimeout(() => playSound(659.25, 'sine', 0.1), 100);
                setTimeout(() => playSound(783.99, 'sine', 0.3), 200);
            }
        };

        // 遊戲數據
        const defaultGame = {
            money: 0,
            totalMoney: 0,
            level: 1,
            exp: 0,
            mps: 0,
            clickPower: 1,
            items: {
                capybara: { name: "水豚家族", icon: "🐹", baseCost: 15, mps: 1, count: 0, desc: "可愛就是正義，吸引大量遊客。" },
                waiter: { name: "專業招待", icon: "👨‍💼", baseCost: 100, mps: 5, count: 0, desc: "提供頂級清酒與毛巾服務。" },
                herbal: { name: "藥草浴池", icon: "🌿", baseCost: 500, mps: 18, count: 0, desc: "加入昂貴藥材，舒緩身心。" },
                outdoor: { name: "雪景露天風呂", icon: "❄️", baseCost: 2000, mps: 70, count: 0, desc: "在飄雪中享受極致溫暖。" },
                shrine: { name: "祈福神社", icon: "⛩️", baseCost: 8000, mps: 250, count: 0, desc: "吸引信眾前來，香火與溫泉並存。" },
                hotel: { name: "雲海渡假村", icon: "🏰", baseCost: 50000, mps: 1200, count: 0, desc: "俯瞰整片山谷的頂級套房。" }
            }
        };

        let game = JSON.parse(localStorage.getItem('onsen_save')) || JSON.parse(JSON.stringify(defaultGame));

        const moneyEl = document.getElementById('money');
        const mpsEl = document.getElementById('mps');
        const levelEl = document.getElementById('level');
        const progEl = document.getElementById('level-progress-bar');
        const shopContent = document.getElementById('shop-content');
        const decorations = document.getElementById('decorations');

        // 保存遊戲
        function saveGame() {
            localStorage.setItem('onsen_save', JSON.stringify(game));
        }

        // 初始化商店
        function initShop() {
            shopContent.innerHTML = '';
            for (let id in game.items) {
                const item = game.items[id];
                const div = document.createElement('div');
                div.className = 'shop-item';
                div.id = `item-${id}`;
                div.innerHTML = `
                    <div class="item-count" id="count-${id}">${item.count}</div>
                    <div class="item-icon">${item.icon}</div>
                    <div class="item-details">
                        <span class="item-name">${item.name}</span>
                        <span class="item-desc">${item.desc}</span>
                        <div class="item-stats">+${item.mps} 圓/秒</div>
                    </div>
                    <div class="item-cost-tag" id="cost-${id}">0</div>
                `;
                div.onclick = () => buyItem(id);
                shopContent.appendChild(div);
            }
            // 恢復裝飾物
            for (let id in game.items) {
                for (let i = 0; i < Math.min(game.items[id].count, 10); i++) spawnDecoration(game.items[id].icon);
            }
        }

        function buyItem(id) {
            const item = game.items[id];
            const cost = Math.floor(item.baseCost * Math.pow(1.15, item.count));
            
            if (game.money >= cost) {
                game.money -= cost;
                item.count++;
                game.mps += item.mps;
                
                sounds.buy();
                if (item.count <= 10) spawnDecoration(item.icon);
                updateUI();
                checkLevel();
                saveGame();
            }
        }

        function spawnDecoration(emoji) {
            const el = document.createElement('div');
            el.className = 'decor';
            el.innerText = emoji;
            el.style.left = Math.random() * 80 + 10 + '%';
            el.style.top = Math.random() * 60 + 20 + '%';
            el.style.animationDelay = (Math.random() * 2) + 's';
            decorations.appendChild(el);
            if (decorations.childNodes.length > 50) decorations.removeChild(decorations.firstChild);
        }

        function checkLevel() {
            const nextLevelExp = Math.pow(game.level, 2) * 200;
            if (game.totalMoney >= nextLevelExp) {
                game.level++;
                game.clickPower = 1 + Math.floor(game.level * 1.5);
                sounds.levelUp();
                alert(`恭喜！渡假村升級到等級 ${game.level}！\n點擊威力提升！`);
                saveGame();
            }
            const currentLevelBase = Math.pow(game.level - 1, 2) * 200;
            const progress = ((game.totalMoney - currentLevelBase) / (nextLevelExp - currentLevelBase)) * 100;
            progEl.style.width = Math.min(progress, 100) + '%';
        }

        function updateUI() {
            moneyEl.innerText = Math.floor(game.money).toLocaleString();
            mpsEl.innerText = game.mps.toLocaleString();
            levelEl.innerText = game.level;

            for (let id in game.items) {
                const item = game.items[id];
                const cost = Math.floor(item.baseCost * Math.pow(1.15, item.count));
                const itemEl = document.getElementById(`item-${id}`);
                const costEl = document.getElementById(`cost-${id}`);
                const countEl = document.getElementById(`count-${id}`);
                
                if (costEl) costEl.innerText = cost.toLocaleString();
                if (countEl) countEl.innerText = item.count;
                
                if (itemEl) {
                    if (game.money >= cost) itemEl.classList.remove('locked');
                    else itemEl.classList.add('locked');
                }
            }
        }

        // 點擊事件
        document.getElementById('clicker').addEventListener('click', (e) => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            game.money += game.clickPower;
            game.totalMoney += game.clickPower;
            
            sounds.click();
            
            const pop = document.createElement('div');
            pop.className = 'click-pop animate__animated animate__fadeOutUp';
            pop.innerText = `+${game.clickPower}`;
            pop.style.left = e.clientX + 'px';
            pop.style.top = e.clientY + 'px';
            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), 800);

            createSteam(e.clientX, e.clientY);
            updateUI();
            checkLevel();
        });

        function createSteam(x, y) {
            for (let i = 0; i < 3; i++) {
                const s = document.createElement('div');
                s.className = 'steam-particle';
                s.innerText = '☁️';
                s.style.left = (x - 20 + Math.random() * 40) + 'px';
                s.style.top = y + 'px';
                s.style.animationDelay = (Math.random() * 0.5) + 's';
                document.body.appendChild(s);
                setTimeout(() => s.remove(), 3000);
            }
        }

        // 控制功能
        document.getElementById('mute-btn').onclick = function() {
            muted = !muted;
            this.innerText = muted ? '🔇' : '🔊';
        };

        document.getElementById('reset-btn').onclick = function() {
            if (confirm('確定要拆除整個渡假村重新開始嗎？')) {
                game = JSON.parse(JSON.stringify(defaultGame));
                saveGame();
                location.reload();
            }
        };

        // 自動保存
        setInterval(saveGame, 10000);

        // 遊戲循環
        setInterval(() => {
            const income = game.mps / 10;
            game.money += income;
            game.totalMoney += income;
            updateUI();
            if (game.mps > 0) checkLevel();
        }, 100);

        initShop();
        updateUI();
    </script>
</body>
</html>
