<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>給最親愛的老婆 ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;500&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
<style>
    :root {
        --primary-pink: #d81b60;
        --soft-pink: #f8bbd0;
        --bg-gradient: linear-gradient(135deg, #fff5f5 0%, #fff0f5 100%);
    }

    * { box-sizing: border-box; }

    body {
        margin: 0; padding: 0;
        background: var(--bg-gradient);
        font-family: 'Noto Sans TC', sans-serif;
        color: #444;
        overflow-x: hidden;
    }
    
    .heart {
        position: fixed; top: -1vh; font-size: 1.5rem; color: #ff4081; opacity: 0.6; z-index: 999;
        animation: fall linear infinite;
    }
    @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }

    header {
        text-align: center; padding: 80px 20px;
        background: white;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h1 { font-family: 'Noto Serif TC', serif; font-size: clamp(2rem, 8vw, 3.5rem); color: var(--primary-pink); margin-bottom: 10px; }
    p.subtitle { font-size: 1.2rem; color: #888; letter-spacing: 2px; }

    .love-timer-box {
        text-align:center; margin-top: 20px; 
        background: rgba(216, 27, 96, 0.05); 
        padding: 20px; border-radius: 20px; 
        display: inline-block; border: 1px solid var(--soft-pink);
    }

    .timeline {
        max-width: 800px;
        margin: 40px auto;
        padding: 20px;
        position: relative;
    }
    .timeline::before {
        content: '';
        position: absolute;
        left: 50%;
        width: 2px;
        height: 100%;
        background: var(--soft-pink);
        transform: translateX(-50%);
    }
    .timeline-item {
        margin-bottom: 30px;
        position: relative;
        width: 50%;
        padding: 10px 30px;
    }
    .timeline-item:nth-child(odd) { left: 0; text-align: right; }
    .timeline-item:nth-child(even) { left: 50%; text-align: left; }
    .timeline-dot {
        position: absolute;
        top: 15px;
        width: 15px;
        height: 15px;
        background: var(--primary-pink);
        border-radius: 50%;
        z-index: 10;
    }
    .timeline-item:nth-child(odd) .timeline-dot { right: -7.5px; }
    .timeline-item:nth-child(even) .timeline-dot { left: -7.5px; }
    .timeline-date { font-weight: bold; color: var(--primary-pink); margin-bottom: 5px; }
    .timeline-content { font-size: 1rem; color: #666; }

    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 30px;
        padding: 40px;
        max-width: 1200px;
        margin: 0 auto;
    }
    .polaroid {
        background: white;
        padding: 15px 15px 40px 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        border-radius: 2px;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        cursor: pointer;
    }
    .polaroid img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border: 1px solid #f0f0f0;
    }
    .polaroid:hover {
        transform: scale(1.1) rotate(0deg) !important;
        z-index: 100;
    }
    .polaroid::after {
        content: 'Our Memories';
        font-family: 'Zhi Mang Xing', cursive;
        display: block;
        text-align: center;
        margin-top: 15px;
        font-size: 1.2rem;
        color: #777;
    }

    .message-box {
        text-align: center; padding: 60px 40px; background: white;
        margin: 60px auto; max-width: 700px; border-radius: 30px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.05);
        position: relative;
        min-height: 400px;
    }
    #typewriter {
        font-size: 1.2rem; line-height: 2.2; text-align: left;
        white-space: pre-wrap;
        display: inline-block;
        font-family: 'Noto Serif TC', serif;
    }

    .btn {
        background: var(--primary-pink); color: white; border: none; padding: 18px 50px;
        font-size: 1.2rem; border-radius: 50px; cursor: pointer;
        box-shadow: 0 8px 25px rgba(216, 27, 96, 0.3);
        transition: all 0.3s; margin-top: 30px;
    }

    #audio-control {
        position: fixed; bottom: 30px; right: 30px;
        background: white; width: 65px; height: 65px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        cursor: pointer; z-index: 1000; font-size: 2.2rem;
        border: 3px solid var(--soft-pink);
    }

    .modal {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8); z-index: 2000;
        justify-content: center; align-items: center;
        backdrop-filter: blur(8px);
    }
    .ticket {
        background: white; width: 90%; max-width: 450px; padding: 40px;
        border-radius: 25px; text-align: center; border: 5px dashed var(--primary-pink);
        position: relative; animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @media (max-width: 600px) { 
        .gallery { padding: 20px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } 
        .timeline::before { left: 20px; }
        .timeline-item { width: 100%; text-align: left !important; padding-left: 50px; }
        .timeline-dot { left: 12.5px !important; }
        .message-box { padding: 30px 20px; margin: 20px; }
    }
</style>
</head>
<body>

<div id="yt-player" style="position: absolute; top: -9999px; left: -9999px;"></div>
<div id="audio-control" onclick="toggleAudio()">⏳</div>

<header>
    <h1>給最親愛的妳 ❤️</h1>
    <p class="subtitle">2026 VALENTINE'S DAY</p>
    <div class="love-timer-box">
        <p style="color:#888; margin:0; font-size:1rem;">老婆，我們已經攜手走過</p>
        <div id="counter" style="font-size: 1.8rem; font-weight: bold; color: var(--primary-pink); line-height:1.4; margin-top:5px;">...</div>
    </div>
</header>

<div class="timeline">
    <div class="timeline-item"><div class="timeline-dot"></div><div class="timeline-date">2021.08.05</div><div class="timeline-content">正式成為夫妻 💍</div></div>
    <div class="timeline-item"><div class="timeline-dot"></div><div class="timeline-date">努力的回憶</div><div class="timeline-content">妳陪我考取老師 📚</div></div>
    <div class="timeline-item"><div class="timeline-dot"></div><div class="timeline-date">甜蜜的負擔</div><div class="timeline-content">雙胞胎寶貝出生 👶👶</div></div>
</div>

<div class="gallery" id="photoWall"></div>

<div class="message-box">
    <div id="typewriter"></div>
    <div id="gift-area" style="display:none;"><button class="btn" onclick="openGift()">🎁 領取老公的小心意</button></div>
</div>

<div id="giftModal" class="modal" onclick="closeGift()">
    <div class="ticket">
        <h2 style="color:var(--primary-pink);">🎟️ 專屬願望兌換券 x 3</h2>
        <p style="font-size:4rem; margin:20px 0;">🧞‍♂️</p>

        <p style="color:#d81b60; font-weight:bold; margin-top:30px;">「老婆妳辛苦了，我愛妳！」</p>
    </div>
</div>

    function loadRandomPhotos() {
        const wall = document.getElementById('photoWall');
        wall.innerHTML = '';
        const shuffled = [...allPhotos].sort(() => 0.5 - Math.random());
        shuffled.slice(0, 24).forEach(src => {
            const container = document.createElement('div');
            container.className = 'polaroid';
            const rotate = (Math.random() * 12 - 6).toFixed(2);
            container.style.transform = `rotate(${rotate}deg)`;
            container.innerHTML = `<img src="${src}" loading="lazy">`;
            wall.appendChild(container);
        });
    }

    const message = "親愛的老婆：\n\n情人節快樂！❤️\n\n謝謝妳總是在我身邊，默默地支持我考取老師、陪我走過那段壓力巨大的低潮期。妳不只是一個完美的妻子，更是我們雙胞胎寶貝最強大的依靠。\n\n我知道我平時比較木頭，不太會說甜言蜜語，但我內心真的很感激這輩子能遇到妳。這份網頁是我一點小小的驚喜，希望能讓妳感受到我的愛。\n\n老婆，辛苦了！我會努力給妳和孩子們更好的未來。";
    let index = 0;
    function typeWriter() {
        if (index < message.length) {
            document.getElementById("typewriter").innerHTML += message.charAt(index);
            index++;
            setTimeout(typeWriter, 120);
        } else {
            document.getElementById("gift-area").style.display = "block";
        }
    }

    const startDate = new Date('2021-08-05T00:00:00');
    function updateCounter() {
        const now = new Date();
        const diff = now - startDate;
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        let y = now.getFullYear() - startDate.getFullYear();
        let m = now.getMonth() - startDate.getMonth();
        let d = now.getDate() - startDate.getDate();
        if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
        if (m < 0) { y--; m += 12; }
        document.getElementById('counter').innerHTML = `${y} 年 ${m} 個月 ${d} 天<br><small>(共 ${days} 天的幸福時光)</small>`;
    }
    setInterval(updateCounter, 1000);

    function createHeart() {
        const heart = document.createElement('div');
        heart.className = 'heart'; heart.innerHTML = '❤️';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = Math.random() * 3 + 3 + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
    }
    setInterval(createHeart, 500);

    function openGift() { document.getElementById('giftModal').style.display = 'flex'; }
    function closeGift() { document.getElementById('giftModal').style.display = 'none'; }

    window.onload = () => {
        loadRandomPhotos();
        updateCounter();
        setTimeout(typeWriter, 1500);
    };
</script>
