<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極上溫泉物語：終極渡假村 - Onsen Tycoon Ultimate</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d35400;
            --secondary: #e67e22;
            --accent: #27ae60;
            --bg: #fdf2e9;
            --panel: #ffffff;
            --text: #2c3e50;
            --wood: #8b4513;
            --gold: #f1c40f;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg);
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-layout { display: flex; width: 100%; height: 100%; }

        #resort-view {
            flex-grow: 1;
            position: relative;
            background: linear-gradient(to bottom, #aed6f1 0%, #d6eaf8 100%);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #skyline { position: absolute; top: 20px; font-size: 100px; opacity: 0.3; user-select: none; }

        .main-onsen {
            font-size: clamp(100px, 20vw, 180px);
            cursor: pointer;
            transition: all 0.1s;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
            user-select: none;
            animation: float-slow 3s ease-in-out infinite;
        }

        .main-onsen:active { animation: shake 0.2s infinite; transform: scale(0.95); }

        @keyframes float-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes shake { 0%, 100% { transform: translate(1px, 1px); } 20% { transform: translate(-3px, 0); } 50% { transform: translate(-1px, 2px); } }

        #decorations { position: absolute; width: 100%; height: 100%; pointer-events: none; }
        .decor { position: absolute; font-size: 40px; animation: bounce-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), bob 2s ease-in-out infinite; }
        @keyframes bob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-15px) rotate(5deg); } }

        .steam-particle { position: absolute; color: white; opacity: 0.6; font-size: 24px; pointer-events: none; animation: steam-rise 3s linear forwards; }
        @keyframes steam-rise { 0% { transform: translateY(0) scale(1); opacity: 0.6; } 100% { transform: translateY(-200px) scale(2); opacity: 0; } }

        #top-bar { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 100; gap: 10px; flex-wrap: wrap; }
        .stat-card { background: rgba(255,255,255,0.9); padding: 10px 20px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; align-items: center; border: 2px solid var(--wood); min-height: 50px; }
        .stat-val { font-size: 1.4rem; font-weight: bold; color: var(--primary); margin-left: 8px; }

        #side-panel { width: 400px; background: var(--panel); border-left: 4px solid var(--wood); display: flex; flex-direction: column; box-shadow: -10px 0 20px rgba(0,0,0,0.1); }
        .tabs { display: flex; background: var(--wood); }
        .tab { flex: 1; padding: 15px; text-align: center; color: white; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        .tab.active { background: var(--primary); }

        .panel-content { flex-grow: 1; overflow-y: auto; padding: 20px; display: none; }
        .panel-content.active { display: block; }

        .shop-item { background: #fff; border: 2px solid #eee; border-radius: 15px; padding: 15px; margin-bottom: 15px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; position: relative; overflow: hidden; }
        .shop-item:hover:not(.locked) { border-color: var(--secondary); background: #fff9f5; transform: translateY(-3px); }
        .shop-item.locked { opacity: 0.6; filter: grayscale(1); cursor: not-allowed; }
        .item-icon { font-size: 40px; margin-right: 15px; width: 60px; text-align: center; }
        .item-details { flex-grow: 1; }
        .item-name { font-weight: bold; font-size: 1.1rem; }
        .item-desc { font-size: 0.85rem; color: #7f8c8d; display: block; }
        .item-stats { margin-top: 5px; font-size: 0.9rem; color: var(--accent); font-weight: bold; }
        .item-cost-tag { background: var(--bg); padding: 5px 12px; border-radius: 20px; font-weight: bold; color: var(--primary); }
        .item-count { position: absolute; top: 0; right: 0; background: var(--wood); color: white; padding: 2px 10px; border-bottom-left-radius: 10px; font-size: 0.8rem; }

        .click-pop { position: absolute; pointer-events: none; font-weight: bold; color: var(--primary); font-size: 24px; z-index: 1000; text-shadow: 1px 1px 2px white; }

        #controls { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 10px; }
        .icon-btn { background: white; border: 2px solid var(--wood); border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; }

        /* 隨機事件：黃金水豚 */
        #golden-capy { position: absolute; font-size: 60px; cursor: pointer; z-index: 1000; filter: drop-shadow(0 0 10px gold); display: none; }

        /* 轉生面板 */
        #prestige-btn { background: var(--gold); border: 2px solid var(--wood); padding: 5px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; display: none; margin-left: 10px; }

        @media (max-width: 900px) {
            #game-layout { flex-direction: column; }
            #side-panel { width: 100%; height: 50%; border-left: none; border-top: 4px solid var(--wood); }
            #top-bar { top: 10px; left: 10px; }
            .stat-card { padding: 5px 15px; min-height: 40px; }
            .stat-val { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div id="game-layout">
        <div id="resort-view">
            <div id="skyline">🗻</div>
            
            <div id="top-bar">
                <div class="stat-card">💰 <span class="stat-val" id="money">0</span></div>
                <div class="stat-card">⭐ <span class="stat-val" id="level">1</span>
                    <button id="prestige-btn">轉生已就緒！</button>
                </div>
                <div class="stat-card">🕒 <span class="stat-val" id="mps" style="color: var(--accent);">0</span> <small>/s</small></div>
            </div>

            <div id="golden-capy" class="animate__animated">🐹</div>

            <div id="decorations"></div>
            <div id="pool-area" style="margin-top: auto; margin-bottom: 50px;"><div class="main-onsen" id="clicker">♨️</div></div>

            <div id="controls">
                <div class="icon-btn" id="mute-btn">🔊</div>
                <div class="icon-btn" id="reset-btn">🔄</div>
            </div>
        </div>

        <div id="side-panel">
            <div class="tabs">
                <div class="tab active" data-tab="shop">建設商店</div>
                <div class="tab" data-tab="upgrades">技術研發</div>
            </div>
            
            <div class="panel-content active" id="shop-content"></div>
            <div class="panel-content" id="upgrades-content"></div>
        </div>
    </div>

    <script>
        // 音效系統
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let muted = false;
        function playSound(freq, type, duration, vol = 0.1) {
            if (muted) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        const sounds = {
            click: () => playSound(440, 'sine', 0.1),
            buy: () => playSound(880, 'square', 0.2),
            event: () => { playSound(600, 'triangle', 0.3); setTimeout(() => playSound(900, 'triangle', 0.3), 100); },
            levelUp: () => { [523, 659, 783].forEach((f, i) => setTimeout(() => playSound(f, 'sine', 0.2), i * 100)); }
        };

        // 數據模型
        const DEFAULT_GAME = {
            money: 0, totalMoney: 0, level: 1, mps: 0, clickPower: 1, prestigeMult: 1,
            lastSave: Date.now(),
            items: {
                capybara: { name: "水豚家族", icon: "🐹", baseCost: 15, mps: 1, count: 0, desc: "可愛就是正義。" },
                waiter: { name: "專業招待", icon: "👨‍💼", baseCost: 100, mps: 5, count: 0, desc: "提供頂級服務。" },
                herbal: { name: "藥草浴池", icon: "🌿", baseCost: 500, mps: 18, count: 0, desc: "舒緩身心。" },
                outdoor: { name: "雪景風呂", icon: "❄️", baseCost: 2000, mps: 70, count: 0, desc: "極致體驗。" },
                hotel: { name: "雲海渡假村", icon: "🏰", baseCost: 10000, mps: 400, count: 0, desc: "頂級套房。" }
            },
            upgrades: {
                strong_tap: { name: "強力噴頭", cost: 100, owned: false, desc: "點擊威力 +100%", effect: () => { game.clickPower *= 2; } },
                auto_clean: { name: "自動洗地機", cost: 500, owned: false, desc: "所有建築產量 +20%", effect: () => { Object.values(game.items).forEach(i => i.mps *= 1.2); recalcMps(); } },
                ads: { name: "臉書廣告", cost: 2000, owned: false, desc: "所有建築產量 +50%", effect: () => { Object.values(game.items).forEach(i => i.mps *= 1.5); recalcMps(); } }
            }
        };

        let game = JSON.parse(localStorage.getItem('onsen_save_v2')) || JSON.parse(JSON.stringify(DEFAULT_GAME));
        let eventActive = false;

        function saveGame() { game.lastSave = Date.now(); localStorage.setItem('onsen_save_v2', JSON.stringify(game)); }
        
        function recalcMps() {
            game.mps = Object.values(game.items).reduce((acc, i) => acc + (i.mps * i.count), 0) * game.prestigeMult;
        }

        // 初始化
        function init() {
            // 離線收益
            const offlineTime = (Date.now() - game.lastSave) / 1000;
            if (offlineTime > 60 && game.mps > 0) {
                const earned = Math.floor(game.mps * offlineTime * 0.5);
                game.money += earned;
                alert(`歡迎回來！離線期間你的溫泉賺了 ${earned.toLocaleString()} 圓！`);
            }

            initTabs();
            renderShop();
            renderUpgrades();
            updateUI();
            
            // 恢復裝飾
            for (let id in game.items) {
                for(let i=0; i<Math.min(game.items[id].count, 15); i++) spawnDecoration(id);
            }
        }

        function initTabs() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.onclick = () => {
                    document.querySelectorAll('.tab, .panel-content').forEach(el => el.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(`${tab.dataset.tab}-content`).classList.add('active');
                };
            });
        }

        function renderShop() {
            const container = document.getElementById('shop-content');
            container.innerHTML = '';
            for (let id in game.items) {
                const item = game.items[id];
                const cost = Math.floor(item.baseCost * Math.pow(1.15, item.count));
                const div = document.createElement('div');
                div.className = `shop-item ${game.money < cost ? 'locked' : ''}`;
                div.id = `shop-${id}`;
                div.innerHTML = `
                    <div class="item-count">${item.count}</div>
                    <div class="item-icon">${item.icon}</div>
                    <div class="item-details">
                        <span class="item-name">${item.name}</span>
                        <span class="item-desc">${item.desc}</span>
                        <div class="item-stats">+${Math.floor(item.mps * game.prestigeMult)} /s</div>
                    </div>
                    <div class="item-cost-tag">${cost.toLocaleString()}</div>
                `;
                div.onclick = () => {
                    const currentCost = Math.floor(item.baseCost * Math.pow(1.15, item.count));
                    if (game.money >= currentCost) {
                        game.money -= currentCost;
                        item.count++;
                        recalcMps();
                        sounds.buy();
                        if (item.count <= 15) spawnDecoration(id); // 改為傳入 id
                        renderShop(); updateUI(); saveGame();
                    }
                };
                container.appendChild(div);
            }
        }

        function renderUpgrades() {
            const container = document.getElementById('upgrades-content');
            container.innerHTML = '<h2>🚀 研發中心</h2>';
            for (let id in game.upgrades) {
                const up = game.upgrades[id];
                if (up.owned) continue;
                const div = document.createElement('div');
                div.className = `shop-item ${game.money < up.cost ? 'locked' : ''}`;
                div.innerHTML = `
                    <div class="item-icon">💡</div>
                    <div class="item-details">
                        <span class="item-name">${up.name}</span>
                        <span class="item-desc">${up.desc}</span>
                    </div>
                    <div class="item-cost-tag">${up.cost.toLocaleString()}</div>
                `;
                div.onclick = () => {
                    if (game.money >= up.cost) {
                        game.money -= up.cost;
                        up.owned = true;
                        up.effect();
                        sounds.buy();
                        renderUpgrades(); updateUI(); saveGame();
                    }
                };
                container.appendChild(div);
            }
        }

        function updateUI() {
            document.getElementById('money').innerText = Math.floor(game.money).toLocaleString();
            document.getElementById('mps').innerText = Math.floor(game.mps).toLocaleString();
            document.getElementById('level').innerText = game.level;
            
            // 更新按鈕鎖定狀態 (不重新渲染整個清單以保持效能)
            document.querySelectorAll('.shop-item').forEach(el => {
                const cost = parseInt(el.querySelector('.item-cost-tag').innerText.replace(/,/g, ''));
                if (game.money >= cost) el.classList.remove('locked');
                else el.classList.add('locked');
            });

            if (game.level >= 10) document.getElementById('prestige-btn').style.display = 'block';
        }

        // 定義各個設施的專屬區域
        const ZONES = {
            capybara: { left: 15, top: 75, spread: 15 }, // 左下草地
            waiter: { left: 85, top: 75, spread: 10 },   // 右下接待區
            herbal: { left: 20, top: 45, spread: 12 },   // 中左藥草區
            outdoor: { left: 80, top: 40, spread: 15 },  // 中右露天區
            hotel: { left: 50, top: 25, spread: 25 }     // 上方背景區
        };

        function spawnDecoration(id) {
            const item = game.items[id];
            if (!item || !ZONES[id]) return;

            const zone = ZONES[id];
            const el = document.createElement('div');
            el.className = 'decor';
            el.innerText = item.icon;
            
            // 在指定區域內加入一點隨機位移，讓它看起來自然但不混亂
            const offsetX = (Math.random() - 0.5) * zone.spread;
            const offsetY = (Math.random() - 0.5) * (zone.spread / 2);
            
            el.style.left = (zone.left + offsetX) + '%';
            el.style.top = (zone.top + offsetY) + '%';
            el.style.animationDelay = (Math.random() * 2) + 's';
            
            document.getElementById('decorations').appendChild(el);
            
            // 如果數量太多，移除最早的（保持效能）
            if (decorations.childNodes.length > 60) decorations.removeChild(decorations.firstChild);
        }

        // 點擊邏輯
        document.getElementById('clicker').onclick = (e) => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const val = game.clickPower * (eventActive ? 10 : 1);
            game.money += val; game.totalMoney += val;
            sounds.click();
            popText(e.clientX, e.clientY, `+${val}`, eventActive ? 'gold' : '');
            createSteam(e.clientX, e.clientY);
            checkLevel(); updateUI();
        };

        function popText(x, y, txt, color) {
            const p = document.createElement('div');
            p.className = 'click-pop animate__animated animate__fadeOutUp';
            p.innerText = txt; p.style.left = x + 'px'; p.style.top = y + 'px';
            if (color) p.style.color = color;
            document.body.appendChild(p); setTimeout(() => p.remove(), 800);
        }

        function createSteam(x, y) {
            for(let i=0; i<3; i++) {
                const s = document.createElement('div');
                s.className = 'steam-particle'; s.innerText = '☁️';
                s.style.left = (x - 20 + Math.random() * 40) + 'px'; s.style.top = y + 'px';
                document.body.appendChild(s); setTimeout(() => s.remove(), 3000);
            }
        }

        function checkLevel() {
            const next = Math.pow(game.level, 2) * 500;
            if (game.totalMoney >= next) {
                game.level++;
                sounds.levelUp();
                renderShop(); renderUpgrades(); updateUI();
            }
        }

        // 隨機事件：黃金水豚
        function triggerEvent() {
            const capy = document.getElementById('golden-capy');
            capy.style.left = Math.random() * 80 + 10 + '%';
            capy.style.top = Math.random() * 70 + 10 + '%';
            capy.style.display = 'block';
            capy.classList.add('animate__bounceIn');
            
            capy.onclick = () => {
                eventActive = true;
                capy.style.display = 'none';
                sounds.event();
                document.body.style.boxShadow = "inset 0 0 100px gold";
                setTimeout(() => {
                    eventActive = false;
                    document.body.style.boxShadow = "none";
                }, 15000);
            };

            setTimeout(() => { capy.style.display = 'none'; }, 8000);
        }

        setInterval(() => { if (Math.random() < 0.1) triggerEvent(); }, 30000);

        // 轉生
        document.getElementById('prestige-btn').onclick = () => {
            if (confirm(`轉生將會重置所有建築，但你會獲得 ${game.level * 10}% 的永久收益加成。確定嗎？`)) {
                const newMult = game.prestigeMult + (game.level * 0.1);
                game = JSON.parse(JSON.stringify(DEFAULT_GAME));
                game.prestigeMult = newMult;
                saveGame(); location.reload();
            }
        };

        document.getElementById('reset-btn').onclick = () => { if(confirm('重置所有進度？')) { localStorage.removeItem('onsen_save_v2'); location.reload(); } };
        document.getElementById('mute-btn').onclick = function() { muted = !muted; this.innerText = muted ? '🔇' : '🔊'; };

        // 循環
        setInterval(() => {
            game.money += game.mps / 10;
            game.totalMoney += game.mps / 10;
            updateUI();
        }, 100);
        setInterval(saveGame, 5000);

        init();
    </script>
</body>
</html>
