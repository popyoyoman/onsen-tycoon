<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇遇的故事銀行 | 52週精英日課</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fffbf8;
            --text-main: #2c2c2c;
            --text-sub: #7a7a7a;
            --accent: #d4a373;
            --card-bg: #ffffff;
            --line: #f1e9e2;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        header {
            max-width: 900px;
            margin: 0 auto;
            padding: 100px 20px 60px 20px;
            text-align: center;
        }

        header h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 3.2rem;
            margin: 0;
            color: #4a4a4a;
            letter-spacing: 2px;
        }

        header p {
            font-size: 1.2rem;
            color: var(--text-sub);
            margin-top: 20px;
            font-weight: 300;
        }

        .nav-filter {
            max-width: 900px;
            margin: 0 auto 50px auto;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            position: sticky;
            top: 20px;
            z-index: 100;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--line);
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            color: var(--text-sub);
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(212, 163, 115, 0.3);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            gap: 40px;
        }

        .story-item {
            background: var(--card-bg);
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.02);
            border: 1px solid var(--line);
            transition: all 0.4s ease;
        }

        .story-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(212, 163, 115, 0.1);
        }

        .story-meta {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .story-content h2 {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.2rem;
            margin: 0 0 25px 0;
            color: #333;
            line-height: 1.3;
        }

        .story-body {
            font-size: 1.1rem;
            color: #4a4a4a;
            text-align: justify;
            white-space: pre-wrap;
        }

        .wan-insight {
            margin-top: 30px;
            padding: 25px;
            background: #fffaf5;
            border-radius: 15px;
            border-left: 4px solid var(--accent);
            color: #444;
        }

        .wan-insight b {
            display: block;
            font-weight: 700;
            color: var(--accent);
            font-size: 0.95rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        footer {
            margin: 100px 0 50px 0;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .story-item { padding: 30px; }
            header h1 { font-size: 2.2rem; }
            .story-content h2 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🏦 奇遇的故事銀行</h1>
        <p>52週精英日課計畫：在數據中尋找溫度，在混亂中建立模型。</p>
    </header>

    <div class="nav-filter">
        <button class="filter-btn active" onclick="render('all')">年度總覽</button>
        <button class="filter-btn" onclick="render('教育')">教育研究</button>
        <button class="filter-btn" onclick="render('趨勢')">2026趨勢</button>
        <button class="filter-btn" onclick="render('歷史')">歷史翻案</button>
        <button class="filter-btn" onclick="render('紀實')">人生紀實</button>
    </div>

    <div class="container" id="story-grid">
        <!-- 內容載入區 -->
    </div>

    <footer>
        &copy; 2026 奇遇的故事銀行 - 專業溫馨的深度閱讀
    </footer>

    <script>
        const stories = [
            {
                week: 8,
                category: "教育",
                title: "觸覺的補償：為什麼筆尖的摩擦力決定了邏輯的深度？",
                body: "在一座全數位化的校園裡，學生的筆電與平板實現了 100% 的無紙化。然而，數據卻揭露了一個詭異趨勢：學生的打字速度提升，但在處理「長鏈條邏輯證明」時，出錯率卻逐年上升。\n\n研究發現，那些習慣在平板上滑動操作的學生，雖然反應快，但只要邏輯鏈條超過五個步驟，大腦就會出現「短路」。一位認知工學家提出實驗：恢復「摩擦力」。他找來一組學生回到最原始的黑板與粉筆，或是高品質紙張與鋼筆，要求書寫時必須清晰聽到筆尖摩擦聲。\n\n結果，恢復「實體觸覺」後，學生的邏輯嚴密度提升了 50%。腦顯像顯示：當手部感受到真實「物理阻力」時，大腦負責「長期監控」與「深層推理」的區域被顯著激活。而在平滑螢幕上，這些區域幾乎是沈睡的。\n\n意外在於：我們以為數位工具是在解放大腦，其實它是在透過消除阻力來「誘導」大腦走捷徑。那點細微的筆尖摩擦力，竟是大腦邏輯運算的『物理外掛』。",
                insight: "<b>奇遇·深度觀察</b>身體不是大腦的僕人，而是大腦的一部分。在一個追求流暢感的數位時代，保留一點點『物理摩擦力』，是我們維持高級認知功能的必要代價。"
            },
            {
                week: 7,
                category: "科技",
                title: "定義者的特權：當 AI 負責回答，誰來負責提問？",
                body: "2026 年，頂尖律所引進了「完美邏輯」的 AI 代理人。目標是節省 90% 人力，AI 的表現也滴水不漏。然而三個月後，初級律師變得「思考懶惰」，只會複製 AI 建議。當案件進入需要情感抗辯或突破性邏輯的高階法庭時，律所竟然找不到能與法官對話的律師。\n\n合夥人規定：禁止直接詢問答案，必須先對 AI 提出三個「反事實提問」。結果，律師被迫重新進入思考焦慮中。意外發生在一個跨國收購案，對方的 AI 給出了無解僵局，而這間律師卻提出了一個 AI 邏輯樹之外的倫理漏洞，讓對方系統陷入死循環。\n\n轉彎點在於：在資訊透明時代，答案的價值正在歸零，而『懷疑答案』的能力正在成為新的權力。那些能定義問題的人，成了 AI 時代真正的掌棋者。",
                insight: "<b>奇遇·深度觀察</b>我們不缺答案，缺的是具備『批判性好奇心』的個體。教育下一代時，如果還在考核回答問題的速度，那其實是在訓練被取代的平庸。"
            },
            {
                week: 6,
                category: "教育",
                title: "神經塑造假說：如何在挫敗中看見大腦的「物理成長」？",
                body: "芬蘭一所實驗學校利用 2026 年最新的神經科學視覺化技術，讓孩子「看見」進步。阻礙在於，孩子在失敗時的生理焦慮會導致大腦關閉學習通道。老師不再說「加油」，而是展示一張神經元掃描圖。\n\n老師告訴孩子：「你現在感到痛苦，是因為腦中的神經元正試圖向對面發射電流，但還沒連上。這份痛苦就是神經突觸在長大的證據。」孩子開始將困難對應到物理建設。意外發生在邏輯競賽中，當全場陷入沮喪，一個孩子大喊：「喔！我的大腦正在進行大裝修！」\n\n轉彎在於：意志力不只是心理問題，更是一個物理知識問題。當個體能將困難視為大腦鍛鍊而非自尊損害時，就具備了持續演化的動力。",
                insight: "<b>奇遇·深度觀察</b>這是成長型思維的進化版。理解大腦運作的科學規律，能讓我們在混亂的世界中，依然保有客觀觀察自我、持續突破的韌性。"
            },
            {
                week: 5,
                category: "教育",
                title: "必要的難度：為什麼「學得快」的人通常「忘得也快」？",
                body: "一項實驗將學生分為 A、B 兩組。A 組獲得排版清晰、重點完整的講義；B 組則拿到字體模糊、排版混亂的草稿，且老師講解故意留下懸念要求自行補全。短期測驗顯示 A 組遙遙領先，但三個月後綜合大考，A 組表現急轉直下，B 組卻展現了極強的知識遷移能力。\n\n背後模型是『必要的難度 (Desirable Difficulty)』。學習中的「流暢感」往往是認知假象，讓大腦進入省電模式。意外發生在突擊面試，A 組習慣尋找「標籤」，B 組卻能從痛苦過的邏輯鏈條中提取答案。\n\n轉彎點在於：教育者的任務不應是把路鋪平，而是在關鍵處放上石頭。真正的學習是大腦在處理困難時發生的結構重組。",
                insight: "<b>奇遇·深度觀察</b>大腦極度吝嗇，太容易得到的資訊不會被長期儲存。在 AI 隨時餵養答案的時代，主動尋找『必要的難度』，是保護認知深度的唯一手段。"
            },
            {
                week: 4,
                category: "趨勢",
                title: "孤獨的溢價：為什麼 2026 年，「真實的連結」變成了奢侈品？",
                body: "2026 年東京的產品經理研發了完美的「AI 伴侶」，數據漂亮、粘著度高。但佐藤發現，雖然用戶跟 AI 聊得開心，現實中的空虛感卻更強了。他決定參加一場實體陶藝課。他在一位不完美、會沮喪流淚的老師身上，感受到了久違的生命力。\n\n意外發生在結課當天。老師送他一個歪斜的、會漏水的杯子，並說：「這杯子會漏水，就像人一樣，但不完美才是活過的證據。」最驚人的轉彎在於：佐藤回到辦公室，刪除了追求完美的程式碼，改為注入大量「雜訊」與「情緒波動」，用戶真實互動率反而提升了。",
                insight: "<b>奇遇·深度觀察</b>價值源於稀缺。當完美模擬變得廉價時，『真實的混亂』與『有溫度的瑕疵』反而產生溢價。這就是為什麼我們要保留那些不被演算法優化的奇遇。"
            },
            {
                week: 3,
                category: "歷史",
                title: "勤政的詛咒：崇禎皇帝為何救不了大明？",
                body: "崇禎皇帝朱由檢極度勤政：不近女色、每天批閱奏章到深夜，卻在位 17 年間頻繁更換內閣、處決大將。他以為加倍努力能解決問題，卻不知正在摧毀系統最後的容錯空間。\n\n意外發生在 1644 年外敵逼近時，群臣全體沈默，無人願意承擔責任。最深刻的轉彎在於：崇禎以為大明毀在懶惰的官員，但他沒看見的是正處於全球「小冰河期」。在極端環境下，領袖需要的是承認無力並尋求系統韌性，而非加倍勤快。",
                insight: "<b>奇遇·深度觀察</b>這是一個『勤奮的人在錯誤模型中拼命加速』的悲劇。精英懂得跳出既定模型觀察規律，而不是在沈船上把地板擦得更亮。"
            },
            {
                week: 2,
                category: "紀實",
                title: "溫泉池裡的沈默：三代同堂的記憶補償",
                body: "2024 年暑假一場慶生旅行中，全家人在蒸騰霧氣中引導失智長輩放鬆。進入陌生環境的恐懼讓現場充滿沈默，家人們緩緩撥弄水聲，進行了長達半小時的心理破冰。終於，長輩露出笑容。意外發生在回程路上：長輩指著相片，清清楚楚叫出孫子乳名，並說「這水好暖」。我們才驚覺，那張相片真正價值是在混亂記憶中釘下了名為『幸福』的物理錨點。",
                insight: "<b>奇遇·深度觀察</b>記憶具有空間依賴性。對認知下降者，強烈感官體驗是最好的特效藥。這是一筆在時間洪流中搶救回來的硬資產。"
            },
            {
                week: 1,
                category: "教育",
                title: "為什麼 2026 年，最頂級的教育反而是在「製造麻煩」？",
                body: "一位父親為兒子配戴最強 AI 導師，追求零阻力學習。然而三個月後，孩子看到玫瑰花竟只會問 AI 摘要。父親改為啟發模式，只給線索不給答案。直到週末深山露營斷訊，孩子面對發光甲蟲竟然爆發憤怒大哭。轉彎點在那瞬間：父親發現訓練出的不是好奇心，而是對『標準答案』的成癮。",
                insight: "<b>奇遇·深度觀察</b>我們正陷入『認知的透明化陷阱』。在 2026 年，能查到答案的人毫無價值。精英是那個在荒野中依然能忍受混亂、用肉身與世界博弈的人。"
            }
        ];

        function render(filter) {
            const grid = document.getElementById('story-grid');
            grid.innerHTML = '';
            const filtered = filter === 'all' ? stories : stories.filter(s => s.category === filter);
            filtered.forEach(s => {
                const div = document.createElement('div');
                div.className = 'story-item';
                div.innerHTML = `
                    <div class="story-meta">Week ${s.week} • ${s.category}</div>
                    <div class="story-content">
                        <h2>${s.title}</h2>
                        <div class="story-body">${s.body}</div>
                        <div class="wan-insight">${s.insight}</div>
                    </div>
                `;
                grid.appendChild(div);
            });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                if(btn.innerText.includes(filter) || (filter === 'all' && btn.innerText === '年度總覽')) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        render('all');
    </script>
</body>
</html>
