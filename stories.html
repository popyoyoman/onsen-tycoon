<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>故事銀行：靈感儲蓄所 - Story Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f0f2f5;
            --primary: #2c3e50;
            --accent: #d35400; 
            --secondary: #7f8c8d;
            --front-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --back-bg: #fff9f5;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.5rem;
            margin: 0;
            letter-spacing: 2px;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            flex-grow: 1;
        }

        /* 篩選列 */
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            border: 1px solid #ddd;
            background: white;
            padding: 6px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .filter-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* 故事網格 */
        .story-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            perspective: 1000px; /* 3D 透視 */
        }

        /* 翻牌容器 */
        .card-container {
            width: 100%;
            height: 450px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 20px;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* 卡片正面與背面 */
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 正面樣式 (類比 SwiftUI 的 Color.blue.gradient) */
        .card-front {
            background: var(--front-gradient);
            color: white;
        }

        .card-front .icon { font-size: 60px; margin-bottom: 20px; }
        .card-front h2 { font-family: 'Noto Serif TC', serif; font-size: 1.8rem; margin: 0 0 10px 0; }
        .card-front .quote { font-size: 1.1rem; opacity: 0.9; font-weight: 300; }

        /* 背面樣式 (類比 SwiftUI 的 Color.orange.opacity(0.2)) */
        .card-back {
            background-color: var(--back-bg);
            color: var(--primary);
            transform: rotateY(180deg);
            text-align: left;
            justify-content: flex-start;
            overflow-y: auto;
            border: 2px solid #ffedd5;
        }

        .card-back h3 { 
            color: var(--accent); 
            border-bottom: 2px solid #ffd8a8; 
            padding-bottom: 5px; 
            margin-top: 0;
            font-size: 1.2rem;
        }

        .story-section { margin-bottom: 15px; font-size: 0.95rem; line-height: 1.5; }
        .story-section b { color: var(--accent); margin-right: 5px; }

        footer { text-align: center; padding: 40px; color: var(--secondary); font-size: 0.8rem; }

        @media (max-width: 600px) {
            .story-grid { grid-template-columns: 1fr; }
            .card-container { height: 500px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🏦 故事銀行</h1>
        <p>點擊卡片以翻轉提取靈感</p>
    </header>

    <div class="container">
        <div class="filter-bar">
            <button class="filter-btn active" data-category="all">全部</button>
            <button class="filter-btn" data-category="氣運">氣運研究</button>
            <button class="filter-btn" data-category="歷史">歷史翻案</button>
            <button class="filter-btn" data-category="2026">2026 期刊</button>
            <button class="filter-btn" data-category="靈感">創作靈感</button>
        </div>

        <div class="story-grid" id="story-grid">
            <!-- 翻轉卡片由 JS 生成 -->
        </div>
    </div>

    <footer>
        &copy; 2026 故事銀行 - 靈感隨時翻轉
    </footer>

    <script>
        const stories = [
            {
                id: 1,
                title: "開運羅盤的背後",

                category: "氣運",
                icon: "🌀",
                details: {

                    obstacle: "家人利用羅盤強行將其氣運轉移給弟弟。",
                    effort: "暗中觀察規律，自學玄學博弈知識。",
                    result: "關鍵時刻切斷氣運連結，奪回主控權。",
                    twist: "弟弟貪得無厭導致羅盤能量超載崩潰。",
                    ending: "女主重獲氣運如願升學，完成翻案。"
                }
            },
            {
                id: 2,
                title: "崇禎皇帝的最後一搏",
                quote: "勤政之下的悲劇性定格",
                category: "歷史",
                icon: "🏯",
                details: {

                    ending: "評價從「亡國之君」翻案為「悲劇英雄」。"
                }
            },
            {
                id: 3,
                title: "2026 運氣科學",
                quote: "運氣是感知敏銳度的副產品",
                category: "靈感",
                icon: "🧭",
                details: {
                    goal: "透過科學方法增加個人幸運機率。",
                    obstacle: "演算法導致的隨機機緣貧乏。",
                    effort: "實踐偶然性管理，建立弱連結互動。",
                    result: "潛在機會與新靈感提升了 40%。",
                    twist: "過度追求最優解反而會抹殺運氣。",

                }
            },
            {
                id: 4,

                quote: "繞遠路才是捷徑",
                category: "靈感",
                icon: "🏀",

                    twist: "最後一刻對手體力耗盡，基礎功成為關鍵。",
                    ending: "體會到紮實的基本功才是最強的幸運符。"
                }
            },
            {
                id: 5,
                title: "大奉打更人：氣運之子",
                quote: "身負半數國運，在權謀中翻案真相",
                category: "氣運",
                icon: "🕵️",
                details: {
                    goal: "現代警察穿越後，試圖在波譎雲詭的大奉王朝生存。",
                    obstacle: "身陷稅銀失竊案，且體內隱藏著足以毀滅世界的國運。",
                    effort: "利用現代刑偵邏輯破案，並在儒、道、佛三教間周旋。",
                    result: "從底層打更人一路晉升，揭開皇室背後的驚天秘密。",
                    twist: "所謂的「運氣」，其實是千年前佈下的巨大棋局。",
                    ending: "成功守護國運並翻轉大奉命運，成為真正的掌棋者。"
                }
            },
            {
                id: 6,
                title: "臺灣經濟四百年的迷思",
                quote: "打破奇蹟神話，重看發展規律",
                category: "歷史",
                icon: "📈",
                details: {
                    goal: "吳聰敏教授試圖客觀還原臺灣四百年的經濟真相。",

                    twist: "傳統教科書中的許多「英雄事蹟」其實是受全球局勢驅動。",
                    ending: "成功為臺灣經濟史「翻案」，還原數據與事實的本質。"
                }
            },
            {
                id: 7,
                title: "借運者的代價",
                quote: "走捷徑的人，往往要在出口付出利息",
                category: "氣運",
                icon: "💸",
                details: {
                    goal: "一名落魄商人通過黑市秘術「借」走競爭對手的運氣。",

                    ending: "回歸平凡，體悟到唯有腳踏實地的努力才是真實的氣運。"
                }
            },
            {
                id: 8,
                title: "2026：代理型 AI 元年",
                quote: "從工具到代理，AI 開始擁有自主執行的能力",
                category: "2026",
                icon: "🤖",
                details: {
                    goal: "探索 2026 年企業如何透過 Agentic AI 實現完全自動化營運。",
                    obstacle: "技術成熟度不均與倫理監管的雙重挑戰。",
                    effort: "跨國諮詢機構（如 Deloitte）發布深度趨勢報告。",

                    twist: "人類的角色從「執行者」轉變為「意圖管理者」。",
                    ending: "定義了 2026 年為人工智慧真正滲透進生活骨幹的一年。"
                }
            },
            {
                id: 9,
                title: "2026 消費心理報告",
                quote: "在「無腦廢文」與「數位排毒」之間找平衡",
                category: "2026",
                icon: "📱",
                details: {
                    goal: "理解 2026 年消費者為什麼對數位世界感到疲憊。",
                    obstacle: "演算法過載與虛假訊息氾濫導致的心理過載。",
                    effort: "WGSN 與 Vogue 聯合發布趨勢預測。",
                    result: "極端粉絲經濟（Superfandom）與離線回歸同步發生。",
                    twist: "最成功的品牌不再追求流量，而是追求真實的「共感」。",
                    ending: "揭示了 2026 年「真實性」才是最強大的商業競爭力。"
                }
            },
            {
                id: 10,
                title: "丙午紅馬年的氣運流轉",
                quote: "烈火奔馬，大變局中的生存之道",
                category: "2026",
                icon: "🐎",
                details: {
                    goal: "解析 2026（丙午年）在傳統玄學中的大趨勢。",
                    obstacle: "天干地支皆屬火，象徵極端能量、快速變動與衝突。",
                    effort: "整合各家開運期刊與星象分析報告。",
                    result: "預測金融市場與社會結構將面臨劇烈的重組。",
                    twist: "看似危險的「火」，卻也是焚毀舊習、迎來重生的契機。",
                    ending: "建議以「守中、冷靜、靈活」作為 2026 年的最佳處世方針。"
                }
            }
        ];

        function renderStories(filter = 'all') {
            const grid = document.getElementById('story-grid');
            grid.innerHTML = '';
            const filtered = filter === 'all' ? stories : stories.filter(s => s.category === filter);

            filtered.forEach(story => {
                const container = document.createElement('div');
                container.className = 'card-container';
                container.onclick = () => container.classList.toggle('flipped');
                
                container.innerHTML = `
                    <div class="card-inner">
                        <!-- 正面 -->
                        <div class="card-front">
                            <div class="icon">${story.icon}</div>
                            <h2>${story.title}</h2>
                            <div class="quote">「${story.quote}」</div>
                        </div>
                        <!-- 背面 -->
                        <div class="card-back">
                            <h3>📜 故事脈絡</h3>
                            <div class="story-section"><b>🎯 目標：</b>${story.details.goal}</div>
                            <div class="story-section"><b>🚧 阻礙：</b>${story.details.obstacle}</div>
                            <div class="story-section"><b>💪 努力：</b>${story.details.effort}</div>
                            <div class="story-section"><b>📝 結果：</b>${story.details.result}</div>
                            <div class="story-section"><b>🔄 意外轉彎：</b>${story.details.twist}</div>
                            <div class="story-section"><b>🎌 結局：</b>${story.details.ending}</div>
                        </div>
                    </div>
                `;
                grid.appendChild(container);
            });
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.filter-btn').forEach(el => el.classList.remove('active'));
                btn.classList.add('active');
                renderStories(btn.dataset.category);
            };
        });

        renderStories();
    </script>
</body>
</html>
