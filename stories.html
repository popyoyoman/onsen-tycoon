<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇遇的故事銀行 | 專業溫馨的閱讀空間</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fffbf8; /* 暖米色背景 */
            --text-main: #2c2c2c;
            --text-sub: #7a7a7a;
            --accent: #d4a373; /* 溫馨的琥珀色 */
            --card-bg: #ffffff;
            --line: #f1e9e2;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        header {
            max-width: 900px;
            margin: 0 auto;
            padding: 100px 20px 60px 20px;
            text-align: center;
        }

        header h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 3.2rem;
            margin: 0;
            color: #4a4a4a;
            letter-spacing: 2px;
        }

        header p {
            font-size: 1.2rem;
            color: var(--text-sub);
            margin-top: 20px;
            font-weight: 300;
        }

        .nav-filter {
            max-width: 900px;
            margin: 0 auto 50px auto;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--line);
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            color: var(--text-sub);
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(212, 163, 115, 0.3);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            gap: 40px;
        }

        .story-item {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            border: 1px solid var(--line);
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 30px;
            transition: transform 0.3s;
        }

        .story-item:hover {
            transform: translateY(-5px);
        }

        .story-icon {
            font-size: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            width: 80px; height: 80px;
            border-radius: 15px;
        }

        .story-content h2 {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.8rem;
            margin: 0 0 15px 0;
            color: #333;
        }

        .story-quote {
            color: var(--accent);
            font-weight: 500;
            font-size: 1rem;
            margin-bottom: 15px;
            display: block;
        }

        .story-details {
            font-size: 1.05rem;
            color: #555;
            margin-bottom: 25px;
        }

        .story-section {
            margin-bottom: 8px;
            display: flex;
            gap: 10px;
        }

        .story-section b { color: var(--accent); min-width: 60px; }

        footer {
            margin: 100px 0 50px 0;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .story-item { grid-template-columns: 1fr; padding: 30px; }
            header h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🏦 故事銀行</h1>
        <p>每一張卡片，都是一段值得細細品讀的生命印記。</p>
    </header>

    <div class="nav-filter">
        <button class="filter-btn active" onclick="render('all')">全部故事</button>
        <button class="filter-btn" onclick="render('教育')">教育研究</button>
        <button class="filter-btn" onclick="render('歷史')">歷史翻案</button>
        <button class="filter-btn" onclick="render('經歷')">人生經歷</button>
    </div>

    <div class="container" id="story-grid">
        <!-- 內容由 JS 動態生成 -->
    </div>

    <footer>
        &copy; 2026 奇遇的故事銀行 - 專業且溫馨的數位收藏
    </footer>

    <script>
        const stories = [
            {
                category: "教育",
                icon: "🎓",
                title: "OECD 教育趨勢 2026",
                quote: "AI 時代，讓學習回歸個性化的溫度",
                details: "這份報告深刻定義了未來五年的教育走向，AI 將成為孩子最親密的學習夥伴，幫助發掘每個人獨特的天賦。"
            },
            {
                category: "經歷",
                icon: "🛁",
                title: "溫泉池裡的一週歲慶生",
                quote: "最平凡的瞬間，最深刻的溫暖",
                details: "2024 年暑假，全家人在蒸騰的煙霧與笑聲中，見證了寶貝第一個生日。這張照片承載了祖孫三代交會的愛。"
            },
            {
                category: "經歷",
                icon: "🚶‍♂️",
                title: "寶貝跨出的第一步",
                quote: "2024 暑假，勇氣的開始",
                details: "在那次聚餐中，寶貝第一次張開手搖晃地走向我們。這一小步，是全家人屏息以待的奇蹟瞬間。"
            },
            {
                category: "教育",
                icon: "🧠",
                title: "社交情緒學習 (SEL)",
                quote: "哈佛研究：情感力是未來的競爭力",
                details: "在高度自動化的世界，自我覺察與同理心將成為孩子最堅實的盔甲。研究顯示，SEL 能提升學業表現達 11%。"
            },
            {
                category: "歷史",
                icon: "🏯",
                title: "崇禎皇帝的最後一搏",
                quote: "重新解讀大明終局的悲劇英雄",
                details: "當我們撇開成敗論英雄，會發現崇禎在極端天災下的勤政與掙扎，其實是一場非人力可逆轉的時代悲劇。"
            }
        ];

        function render(filter) {
            const grid = document.getElementById('story-grid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' ? stories : stories.filter(s => s.category === filter);
            
            filtered.forEach(s => {
                const div = document.createElement('div');
                div.className = 'story-item';
                div.innerHTML = `
                    <div class="story-icon">${s.icon}</div>
                    <div class="story-content">
                        <span class="story-quote">「${s.quote}」</span>
                        <h2>${s.title}</h2>
                        <div class="story-details">${s.details}</div>
                    </div>
                `;
                grid.appendChild(div);
            });

            // 更新按鈕樣式
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if(btn.innerText.includes(filter) || (filter === 'all' && btn.innerText === '全部故事')) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        render('all');
    </script>
</body>
</html>
