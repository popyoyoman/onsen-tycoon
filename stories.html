<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇遇的故事銀行 | 52週精英日課</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fffbf8;
            --text-main: #2c2c2c;
            --text-sub: #7a7a7a;
            --accent: #d4a373;
            --card-bg: #ffffff;
            --line: #f1e9e2;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        header {
            max-width: 900px;
            margin: 0 auto;
            padding: 100px 20px 60px 20px;
            text-align: center;
        }

        header h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 3.2rem;
            margin: 0;
            color: #4a4a4a;
            letter-spacing: 2px;
        }

        header p {
            font-size: 1.2rem;
            color: var(--text-sub);
            margin-top: 20px;
            font-weight: 300;
        }

        .nav-filter {
            max-width: 900px;
            margin: 0 auto 50px auto;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            position: sticky;
            top: 20px;
            z-index: 100;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--line);
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            color: var(--text-sub);
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(212, 163, 115, 0.3);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            gap: 40px;
        }

        .story-item {
            background: var(--card-bg);
            padding: 45px;
            border-radius: 24px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.02);
            border: 1px solid var(--line);
            transition: all 0.4s ease;
        }

        .story-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(212, 163, 115, 0.1);
        }

        .story-meta {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .story-content h2 {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.2rem;
            margin: 0 0 25px 0;
            color: #333;
            line-height: 1.3;
        }

        .story-body {
            font-size: 1.1rem;
            color: #4a4a4a;
            text-align: justify;
            white-space: pre-wrap; /* 保持段落換行 */
        }

        .wan-insight {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px dashed var(--line);
            font-style: italic;
            color: #555;
            position: relative;
        }

        .wan-insight::before {
            content: "Antigravity 洞見";
            display: block;
            font-style: normal;
            font-weight: 700;
            color: var(--accent);
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        footer {
            margin: 100px 0 50px 0;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .story-item { padding: 30px; }
            header h1 { font-size: 2.2rem; }
            .story-content h2 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🏦 奇遇的故事銀行</h1>
        <p>52週年度計畫：存入智慧，提取洞見。</p>
    </header>

    <div class="nav-filter">
        <button class="filter-btn active" onclick="render('all')">年度總覽</button>
        <button class="filter-btn" onclick="render('教育')">教育研究</button>
        <button class="filter-btn" onclick="render('科技')">2026趨勢</button>
        <button class="filter-btn" onclick="render('歷史')">歷史翻案</button>
        <button class="filter-btn" onclick="render('經歷')">人生紀實</button>
    </div>

    <div class="container" id="story-grid">
        <!-- 52 篇內容將在此動態加載 -->
    </div>

    <footer>
        &copy; 2026 奇遇的故事銀行 - 每週三 19:00 更新
    </footer>

    <script>
        const stories = [
            {
                week: 1,
                category: "教育",
                title: "為什麼 2026 年，最頂級的教育反而是在「製造麻煩」？",
                body: `在矽谷有一位資深父親大衛。為了讓 5 歲的兒子在 2026 年這波代理型 AI 浪潮中保持絕對領先，他讓兒子全天候配戴最新的智慧導師。他的目標非常宏大：在入學前，兒子就必須透過 AI 的即時引導，掌握小學三年級的邏輯與詞彙量。\n\n然而，計畫實施三個月後，大衛卻感受到一種莫名的恐懼。當兒子看到一朵真實的玫瑰花時，他的第一反應不是去聞花香或觸摸花瓣，而是轉頭問 AI：「這朵花的 Wikipedia 摘要是什麼？」大衛驚覺，兒子對世界的感知正在被資訊外包。為了扭轉這個局勢，大衛決定「硬碰硬」，他強制關閉了 AI 的搜尋功能，改為嚴格的「啟發模式」。每當兒子提問，AI 不再給答案，而是給出三條引導性的線索。\n\n大衛看著後台數據，感到欣慰極了。數據顯示，兒子學會了像神探一樣觀察植物、拆解複雜的機械模型，他的「好奇心指標」甚至達到了歷史新高。\n\n直到那個週末，全家去深山露營。山區完全沒有訊號，那台昂貴的 AI 導師瞬間成了裝飾品。這時，一隻閃爍著微光、極其罕見的甲蟲飛到了兒子手邊。大衛屏息以待，心想這三個月的訓練終於要派上用場了。沒想到，兒子看著那隻甲蟲，卻爆發出前所未有的憤怒。他猛力將甲蟲撥開，放聲大哭：「這沒有意義！因為沒有人告訴我它叫什麼！沒有標籤的東西，根本不應該存在！」\n\n大衛在那一瞬間如墜冰窖。他終於看清了那個隱藏的轉彎：這三個月來，他訓練出的並不是一個有好奇心的孩子，而是一個對「標準答案」極度成癮的病人。`,
                insight: "這就是 2026 年 OECD 國際教育期刊與《Nature》最核心的警告：我們正陷入「認知的透明化陷阱」。萬維鋼曾提醒過，真正的博學，不在於知道答案，而在於知道如何面對『不知道』。當技術讓知識變得太過零阻力時，我們其實是在剝奪孩子建立『內部獎勵系統』的機會。真正的精英，是那個在完全孤立無援的荒野中，依然能用肉身與現實世界博弈的人。"
            },
            {
                week: 2,
                category: "經歷",
                title: "溫泉池裡的沈默：三代同堂的記憶補償",
                body: `2024 年暑假，毛地帶著全家人來到一間靜謐的溫泉飯店。他的目標很簡單：為剛滿一週歲的寶貝慶生，並讓長期受失智症困擾的母親能在溫暖的水氣中放鬆心情。為了這一刻，他提前一個月預訂了有無障礙設施的頂級湯屋。\n\n然而，溫泉池的蒸騰霧氣並未立刻消融母親的焦慮。剛進湯屋時，母親因為陌生的環境而緊抓著扶手不肯下水，口中反覆念叨著家裡的瑣事。寶貝也因為水溫的觸感而感到不安，小小的湯屋裡充滿了壓抑的沈默。毛地沒有放棄，他先抱著寶貝緩緩進入水中，用手撥弄出輕柔的水聲，並示意太太引導母親坐到池邊。這場「破冰」持續了整整半個小時。\n\n終於，溫暖的水流讓母親的肌肉慢慢放鬆，她看著在水中嬉戲的孫子，臉上露出了久違的慈祥笑容。這一刻，毛地舉起相機，按下快門，捕捉到了三代人在水中相視而笑的畫面。\n\n意外發生在聚餐回程的路上。母親突然指著相機裡的預覽圖，清清楚楚地叫出了孫子的乳名，並說了一句：「這水好暖喔。」這在平時幾乎是不可能的奇蹟，全車的人在那一刻都屏住了呼吸。毛地原本以為，這次旅行最大的收穫是拍到好照片。但他彎下腰整理行李時才驚覺，那張照片真正的價值不是構圖，而是它在那個瞬間，「強行」在母親混亂的大腦中釘下了一個名為『幸福』的物理錨點。`,
                insight: "萬維鋼在探討『情感資產』時曾提到，人類的記憶是具有『空間依賴性』的。對於認知功能下降的長輩，這種帶有強烈物理感官（水溫、觸感、笑聲）的『奇遇』，是比任何藥物都能延緩遺忘的特效藥。這張照片不只是回憶，它是你為家人在時間洪流中搶救回來的、最硬的資產。"
            }
            // 剩下的 50 篇將持續更新入庫
        ];

        function render(filter) {
            const grid = document.getElementById('story-grid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' ? stories : stories.filter(s => s.category === filter);
            
            filtered.forEach(s => {
                const div = document.createElement('div');
                div.className = 'story-item';
                div.innerHTML = `
                    <div class="story-meta">Week ${s.week} • ${s.category}</div>
                    <div class="story-content">
                        <h2>${s.title}</h2>
                        <div class="story-body">${s.body}</div>
                        <div class="wan-insight">${s.insight}</div>
                    </div>
                `;
                grid.appendChild(div);
            });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                if(btn.innerText.includes(filter) || (filter === 'all' && btn.innerText === '年度總覽')) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        render('all');
    </script>
</body>
</html>
