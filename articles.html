<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>開運文摘：每日自動更新 - Fortune Reader</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f1ea;
            --text: #2c3e50;
            --accent: #8b4513;
            --card: #ffffff;
        }

        body {
            font-family: 'Noto Serif TC', serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 20px;
        }

        h1 { margin: 0; color: var(--accent); font-size: 2.5rem; }
        .subtitle { font-size: 1rem; color: #666; margin-top: 10px; }

        #articles-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .article-card {
            background: var(--card);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            border-left: 5px solid var(--accent);
        }

        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .article-date { font-size: 0.85rem; color: #999; margin-bottom: 10px; }
        .article-title { font-size: 1.5rem; margin: 0 0 15px 0; color: var(--accent); }
        .article-excerpt { font-size: 1.1rem; color: #444; margin-bottom: 20px; }
        
        .read-more {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: var(--accent);
            padding: 8px 20px;
            border-radius: 4px;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .read-more:hover { opacity: 0.8; }

        .loading { text-align: center; font-size: 1.2rem; color: #666; padding: 50px; }
        
        #status-bar {
            text-align: center;
            font-size: 0.8rem;
            color: #999;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>📜 開運文摘</h1>
        <div class="subtitle">自動抓取最新網路文學與開運解析</div>
    </header>

    <div id="articles-container">
        <div class="loading">正在感應氣運，抓取文章中...</div>
    </div>

    <div id="status-bar">
        最後更新：<span id="last-update">-</span> | 自動更新頻率：每 6 小時
    </div>

    <script>
        // 我們使用 RSS2JSON API 來抓取內容 (這裡以一個知乎或新聞來源作為範例)
        // 你可以之後換成任何你喜歡的 RSS 連結
        const RSS_URL = 'https://rss.feed43.com/9128532845642131.xml'; // 示意連結
        const API_URL = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent('https://www.thepaper.cn/rss')}`;

        async function fetchArticles() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (data.status === 'ok') {
                    renderArticles(data.items);
                    document.getElementById('last-update').innerText = new Date().toLocaleString();
                } else {
                    throw new Error('API Error');
                }
            } catch (error) {
                console.error('Fetch error:', error);
                document.getElementById('articles-container').innerHTML = 
                    '<div class="loading">目前氣運受阻，請稍後再試。</div>';
            }
        }

        function renderArticles(items) {
            const container = document.getElementById('articles-container');
            container.innerHTML = '';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'article-card';
                
                // 格式化日期
                const date = new Date(item.pubDate).toLocaleDateString('zh-TW', {
                    year: 'numeric', month: 'long', day: 'numeric'
                });

                // 處理摘要 (去除 HTML 標籤)
                const excerpt = item.description.replace(/<[^>]*>/g, '').substring(0, 100) + '...';

                card.innerHTML = `
                    <div class="article-date">${date}</div>
                    <h2 class="article-title">${item.title}</h2>
                    <div class="article-excerpt">${excerpt}</div>
                    <a href="${item.link}" target="_blank" class="read-more">閱讀全文</a>
                `;
                container.appendChild(card);
            });
        }

        // 初始化
        fetchArticles();

        // 設定每 10 分鐘自動檢查一次 (模擬即時)
        setInterval(fetchArticles, 600000);
    </script>
</body>
</html>
